</style></head><body><div id="stage"><div class="top"><div class="brand"><b>◉ FATONAUTA</b><span>EXPLORAR / 001</span></div><div class="tag">ENGENHARIA · SUÍÇA</div><div class="source">FONTE: PROTEÇÃO CIVIL SUÍÇA / BABS</div><h1 id="heading"></h1><div class="subtitle" id="subtitle"></div></div><canvas id="world"></canvas><div id="focus"></div><div class="note">ILUSTRAÇÃO DIDÁTICA · SEM ESCALA</div><div class="captionbox"><div class="caption" id="caption"></div></div><div class="footer" id="progress"></div><div class="counter" id="counter"></div></div><script type="module">
import * as T from '/node_modules/three/build/three.module.js';
const manifest=await(await fetch('/config/pilot_bunker_v2.json')).json(), captions=await(await fetch('/outputs/cg-bunker-v2-001/captions.json')).json();
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('world'),antialias:true,alpha:true});renderer.setSize(720,630,false);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;
const scene=new T.Scene(),cam=new T.OrthographicCamera(-6.5,6.5,5.69,-5.69,.1,100);cam.position.set(11,10,14);cam.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xd7f7ff,0x252231,2.4));const key=new T.DirectionalLight(0xffefdc,4);key.position.set(-5,9,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=9;key.shadow.camera.bottom=-9;key.shadow.normalBias=.03;scene.add(key);const rim=new T.DirectionalLight(0x40dcff,2.6);rim.position.set(5,5,-5);scene.add(rim);
function mat(c,metal=0){return new T.MeshStandardMaterial({color:c,roughness:.72,metalness:metal})}
const concrete=mat(0x9aaeb6),edge=mat(0x597789),soil=mat(0x4b3a32),grass=mat(0x596849),blue=mat(0x53e1ed,.2),orange=mat(0xef9b55),cream=mat(0xe9dfc9),dark=mat(0x18283c),steel=mat(0x526b7b,.5);
const model=new T.Group();scene.add(model);const parts={structure:[],air:[],living:[],exit:[]};
function box(x,y,z,w,h,d,m,parent=model,category){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);if(category)parts[category].push(o);return o}
function cyl(x,y,z,r,h,m,parent=model){const o=new T.Mesh(new T.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function tube(points,r,m,parent=model){const path=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p))),o=new T.Mesh(new T.TubeGeometry(path,40,r,8,false),m);parent.add(o);o.castShadow=true;return path}
// Maquete inteira, com frente removida para revelar o interior.
box(0,-1.95,0,9.4,.8,6.4,soil);box(0,-1.45,0,8.6,.34,5.5,concrete,model,'structure');box(0,.05,-2.55,8.6,3.3,.32,concrete,model,'structure');box(-4.15,.05,0,.32,3.3,5.4,concrete,model,'structure');box(4.15,-.7,-.2,.32,1.8,5,concrete,model,'structure');
for(let x=-4;x<=4;x+=.5)box(x,-1.3,2.78,.04,.1,.1,orange); // borda de corte
const roof=new T.Group();model.add(roof);box(0,1.82,0,8.8,.3,5.7,concrete,roof);box(0,2.05,0,9.4,.18,6.2,grass,roof);box(0,2.4,-.5,1.1,.65,1.1,steel,roof);
const doorPivot=new T.Group();doorPivot.position.set(-3.95,-.05,1.05);model.add(doorPivot);box(.65,0,0,1.3,2.4,.24,steel,doorPivot,'structure');box(.97,0,.18,.12,.45,.08,orange,doorPivot);
// Duto, ventilador, filtro e percurso do ar.
const airPath=tube([[1.5,2.9,-2.8],[1.5,1.1,-2.1],[1.5,.25,-1.85],[.3,.15,-1.85],[-1.1,.15,-1.85],[-1.1,.7,-.8]],.12,steel);
const filter=box(.3,.15,-1.85,1.05,1.15,.6,blue,model,'air');for(let i=0;i<4;i++)box(-.07+i*.24,.15,-1.51,.055,.87,.05,dark);
const fan=new T.Group();fan.position.set(-1.15,.7,-.75);model.add(fan);for(let a=0;a<3;a++){const b=box(0,0,0,.12,.75,.05,blue,fan);b.rotation.z=a*Math.PI/3}parts.air.push(...fan.children);
const airDots=[];for(let i=0;i<16;i++){const o=new T.Mesh(new T.SphereGeometry(.09,8,6),blue);model.add(o);airDots.push(o)}
// Beliches com estrutura e travesseiros.
for(let x of [-2.8,-.8]){for(let z of [-.8,.9])for(let dx of [-.65,.65])cyl(x+dx,.05,z,.045,2.6,steel);for(let y of [-.8,.55]){box(x,y,.05,1.45,.18,2.0,steel,model,'living');box(x,y+.15,.05,1.35,.22,1.9,orange,model,'living');box(x,y+.31,-.55,1.1,.13,.43,cream,model,'living')}}
// Compartimento sanitário esquemático e seco.
box(2.8,-.3,-1.4,1.9,2.25,.1,steel,model,'living');box(3.72,-.3,-.75,.1,2.25,1.3,steel,model,'living');cyl(2.7,-.85,-.65,.38,.8,cream);const toiletRing=new T.Mesh(new T.TorusGeometry(.34,.08,8,24),cream);toiletRing.rotation.x=Math.PI/2;toiletRing.position.set(2.7,-.43,-.65);model.add(toiletRing);parts.living.push(toiletRing);
// Rota de emergência lateral, destacada como esquema e não como planta.
const route=tube([[2.6,-1.18,1.25],[4.6,-1.18,1.25],[5.1,-.8,1.25],[5.1,1.5,1.25]],.1,blue);box(5.1,-.1,1.7,1.0,3.0,.1,steel,model,'exit');for(let y=-1.2;y<1.5;y+=.3)box(5.1,y,1.25,.8,.065,.08,orange,model,'exit');box(5.1,1.55,1.25,1.2,.15,1.2,steel,model,'exit');
const routeDot=new T.Mesh(new T.SphereGeometry(.2,12,8),blue);model.add(routeDot);
const debris=new T.Group();debris.position.set(-3.2,-1,1.8);model.add(debris);for(let i=0;i<7;i++){const o=box(Math.sin(i*7)*.6,(i%3)*.3,Math.cos(i*2)*.35,.6,.5,.5,concrete,debris);o.rotation.set(i*.3,i*.8,i*.4)}
const label=['COUPE: ABRIGO CIVIL','CASCA + FECHAMENTOS','ENTRADA → FILTRO → INTERIOR','BELICHES + SANITÁRIOS','ENTRADA BLOQUEADA → ROTA EXTRA','ESTRUTURA + SISTEMAS + MANUTENÇÃO'];
label[0]='CORTE: ABRIGO CIVIL';
const subtitles=['Mais do que paredes sob a terra.','A proteção começa na estrutura.','O abrigo também precisa respirar.','Um espaço preparado para permanecer.','Uma rota além da porta principal.','O abrigo funciona como um conjunto.'];
for(let i=0;i<6;i++)$('progress').innerHTML+='<div class="bar"><i></i></div>';
const groups=[];for(let s=0;s<6;s++){const words=captions.words.filter(w=>(w.start+w.end)/2>=s*5&&(w.start+w.end)/2<(s+1)*5);for(let i=0;i<words.length;i+=5)groups.push({scene:s,words:words.slice(i,i+5)})}
function clamp(v){return Math.max(0,Math.min(1,v))}function smooth(v){v=clamp(v);return v*v*(3-2*v)}
window.renderAt=t=>{t=Math.max(0,Math.min(29.999,t));const idx=Math.floor(t/5),p=(t%5)/5,sc=manifest.timeline[idx];$('heading').textContent=sc.heading;$('subtitle').textContent=subtitles[idx];$('focus').textContent=label[idx];$('counter').textContent=`${String(idx+1).padStart(2,'0')} / 06    ·    FATONAUTA`;
const chunks=groups.filter(g=>g.scene===idx);let chunk=chunks.find(g=>t>=g.words[0].start&&t<=g.words.at(-1).end);if(!chunk)chunk=chunks.find(g=>g.words.at(-1).end>=t)||chunks.at(-1);$('caption').innerHTML=chunk?chunk.words.map(w=>`<span class="${t>=w.start&&t<=w.end?'active':''}">${w.text}</span>`).join(' '):'';
document.querySelectorAll('.bar i').forEach((e,i)=>e.style.width=(i<idx?100:i===idx?p*100:0)+'%');
roof.visible=idx===0&&p<.62;roof.position.y=smooth((p-.06)/.5)*4;roof.scale.setScalar(1-.25*smooth(p/.6));
doorPivot.rotation.y=idx===1?-.9*(1-smooth(p*2)):-.15;debris.visible=idx===4;debris.scale.setScalar(.2+.8*smooth(p*3));
airDots.forEach((o,i)=>{o.visible=idx===2||idx===5;const u=(t*.23+i/16)%1;o.position.copy(airPath.getPoint(u));o.scale.setScalar(idx===2?1.2:.7)});fan.rotation.z=t*(idx===2?5:1);routeDot.visible=idx===4||idx===5;routeDot.position.copy(route.getPoint((t*.35)%1));
for(const [category,objects] of Object.entries(parts)){const active=(category==='structure'&&idx===1)||(category==='air'&&idx===2)||(category==='living'&&idx===3)||(category==='exit'&&idx===4);for(const o of objects){/* unique geometry remains stable; camera and animated flows guide attention */o.scale.setScalar(active?1+.015*Math.sin(t*3):1)}}
const zoom=[.94,1.03,1.07,1.06,.92,.97][idx];cam.zoom=zoom+.025*Math.sin(p*Math.PI);cam.updateProjectionMatrix();cam.position.set(10.5+Math.sin(t*.15)*.65,9.5,14);cam.lookAt(.3,-.1,0);model.rotation.y=.06*Math.sin(t*.18);renderer.render(scene,cam)};
window.renderAt(0);
</script></body></html>
