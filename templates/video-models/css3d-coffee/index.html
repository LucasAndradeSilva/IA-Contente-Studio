<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared.css"><style>
.cup{position:absolute;left:250px;top:270px;width:220px;height:190px;border-radius:26px 26px 70px 70px;background:linear-gradient(115deg,#faf4e7,#b7ad9d);box-shadow:inset -34px -22px 45px #847c70,0 42px 60px #0009;transform-style:preserve-3d}.cup:before{content:"";position:absolute;left:8px;right:8px;top:-31px;height:68px;border-radius:50%;background:radial-gradient(ellipse,#4d2417 0 47%,#f7efe1 49% 64%,#a99f91 67%)}.cup:after{content:"";position:absolute;right:-77px;top:44px;width:86px;height:95px;border:28px solid #c8beae;border-left:0;border-radius:0 60px 60px 0}
.pack{position:absolute;left:255px;top:90px;width:210px;height:290px;background:linear-gradient(130deg,#9d5a37,#4a2518);clip-path:polygon(8% 0,92% 0,100% 94%,88% 100%,10% 98%,0 93%);box-shadow:0 34px 55px #000b;transform-style:preserve-3d}.pack:before{content:"CAFÉ";position:absolute;left:22px;right:22px;top:88px;padding:18px 0;border:3px solid var(--cream);text-align:center;font-size:42px;font-weight:900;color:var(--cream)}
.no{position:absolute;left:217px;top:64px;width:290px;height:290px;border:22px solid var(--lime);border-radius:50%;box-shadow:0 0 36px #d8ff3e44}.no:after{content:"";position:absolute;left:16px;right:16px;top:113px;height:22px;background:var(--lime);transform:rotate(-38deg);box-shadow:0 0 30px #d8ff3e55}
.kettle{position:absolute;left:180px;top:125px;width:270px;height:260px;border-radius:48% 48% 38% 38%;background:linear-gradient(120deg,#6e7775,#d8ded9 45%,#59615f);box-shadow:0 40px 65px #000b;transform-origin:55% 70%}.kettle:before{content:"";position:absolute;right:-150px;top:28px;border-left:180px solid #949d99;border-top:32px solid transparent;border-bottom:48px solid transparent;transform:rotate(13deg)}.kettle:after{content:"";position:absolute;left:54px;top:-82px;width:160px;height:112px;border:23px solid #434a48;border-bottom:0;border-radius:100px 100px 0 0}
.filter{position:absolute;left:316px;top:390px;width:110px;height:115px;background:linear-gradient(130deg,#e2d6bd,#92856f);clip-path:polygon(0 0,100% 0,72% 100%,28% 100%)}.stream{position:absolute;left:426px;top:278px;width:12px;height:155px;border-radius:20px;background:linear-gradient(#c8e7ed,var(--lime));box-shadow:0 0 22px var(--lime);transform-origin:top}
</style></head><body><div id="stage"><div class="top"><div class="kicker">FATONAUTA • PROTÓTIPO V2</div><div class="pill">CAFÉ</div><div class="source">MODELO VISUAL • 01</div><div class="headline" id="headline">AMARGO?</div><div class="subhead" id="subhead">O erro pode estar no preparo.</div></div><div class="world"><div class="halo"></div><div class="cup" id="cup"></div><div class="pack" id="pack"></div><div class="no" id="no"></div><div class="kettle" id="kettle"></div><div class="filter" id="filter"></div><div class="stream" id="stream"></div></div><div class="caption-wrap"><div class="caption" id="caption"></div></div><div class="engine">HTML / CSS 3D</div></div><script>
const $=id=>document.getElementById(id);const scenes=[{a:0,b:3,h:'AMARGO?',s:'O erro pode estar no preparo.',c:'Sabe por que seu café fica amargo?'},{a:3,b:5,h:'NÃO É',s:'só o pó.',c:'Não é só o pó.'},{a:5,b:8,h:'É O JEITO',s:'como você prepara.',c:'É o que você faz com ele.'}];
for(let i=0;i<18;i++){const p=document.createElement('i');p.className='particle';p.style.left=(30+(i*83)%660)+'px';p.style.top=(390+(i*137)%500)+'px';document.getElementById('stage').appendChild(p)}
function caption(text,p){const w=text.split(' '),i=Math.min(w.length-1,Math.floor(p*w.length));return w.map((x,n)=>`<span class="${n===i?'active':''}">${x}</span>`).join(' ')}
window.renderAt=t=>{t=Math.max(0,Math.min(7.999,t));const sc=scenes.find(x=>t>=x.a&&t<x.b)||scenes[2],p=(t-sc.a)/(sc.b-sc.a);$('headline').textContent=sc.h;$('subhead').textContent=sc.s;$('caption').innerHTML=caption(sc.c,p);const s=scenes.indexOf(sc);$('cup').style.display=s===0?'block':'none';$('pack').style.display=s===1?'block':'none';$('no').style.display=s===1?'block':'none';$('kettle').style.display=s===2?'block':'none';$('filter').style.display=s===2?'block':'none';$('stream').style.display=s===2?'block':'none';$('cup').style.transform=`translateY(${12*Math.sin(p*Math.PI*2)}px) rotateY(${p*18-9}deg)`;$('pack').style.transform=`translateY(${(1-p)*80}px) rotateY(${p*16-8}deg)`;$('no').style.transform=`scale(${.8+.2*Math.min(1,p*3)}) rotate(${p*8-4}deg)`;$('kettle').style.transform=`translateX(${-30+30*p}px) rotate(${12+18*p}deg)`;$('stream').style.transform=`scaleY(${Math.min(1,p*4)})`;document.querySelectorAll('.particle').forEach((e,i)=>e.style.transform=`translateY(${Math.sin(t*.9+i)*18}px)`)};window.renderAt(0);
</script></body></html>
